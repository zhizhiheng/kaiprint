<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161918" />
    <title>KaiPrint 光印 · 创作工作台</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./studio.css" />
    <script type="importmap">
      {
        "imports": {
          "@zip.js/zip.js/index-native.min.js": "./vendor/zip/index-native.min.js",
          "exifr": "./vendor/exifr.js"
        }
      }
    </script>
    <script type="module" src="./studio.js"></script>
  </head>
  <body>
    <header class="top">
      <div class="identity">
        <img src="./assets/mark.svg" width="34" height="34" alt="" /><b
          >KaiPrint</b
        ><span>光印</span>
      </div>
      <span class="navline"></span
      ><span class="workspace-name">创作工作台</span>
      <div class="top-actions">
        <button
          id="open"
          disabled
          class="secondary"
          title="打开照片、光印文件或修图文档（PSD、TIFF、ORA、KRA）"
        >
          <i data-icon="folder"></i><span>打开文件</span></button
        ><button id="save" disabled class="primary">
          <i data-icon="save"></i><span>保存作品</span>
        </button>
      </div>
    </header>
    <main class="workspace" inert>
      <aside class="library" id="library" aria-label="预设和图层">
        <div class="section-title">
          <h2><i data-icon="layout"></i>预设风格</h2>
          <button id="all-styles" class="quiet" title="浏览所有预设">
            全部 <i data-icon="chevron"></i>
          </button>
        </div>
        <div id="quick-styles" class="quick-styles"></div>
        <div class="layers-section">
          <div class="section-title">
            <h2><i data-icon="layers"></i>图层</h2>
            <button
              id="add-layer"
              class="icon-btn"
              aria-label="添加图层"
              title="添加图层"
            >
              <i data-icon="plus"></i>
            </button>
          </div>
          <div id="layers" class="layer-list"></div>
        </div>
        <div class="library-note"><i data-icon="local"></i> 本地工作空间</div>
      </aside>
      <section class="stage" aria-label="作品画布">
        <div class="stage-head">
          <div class="doc-name">
            <span class="eyebrow">当前作品</span>
            <h1 id="document-name">斯凯岛</h1>
          </div>
          <div class="stage-actions">
            <button class="icon-btn" id="undo" title="撤销" aria-label="撤销">
              <i data-icon="undo"></i></button
            ><button class="icon-btn" id="redo" title="重做" aria-label="重做">
              <i data-icon="redo"></i></button
            ><span class="divider"></span
            ><button id="export" class="secondary small">
              <i data-icon="download"></i><span>导出成片</span>
            </button>
          </div>
        </div>
        <div id="viewport" class="viewport">
          <div id="paper" class="paper">
            <canvas id="art" aria-label="带水印的照片预览"></canvas>
          </div>
          <p id="no-photo" class="photo-notice" hidden></p>
        </div>
        <div class="stage-foot">
          <span id="dimensions"><i data-icon="size"></i>载入画布中</span>
          <div class="zoom">
            <button id="minus" class="icon-btn" aria-label="缩小">
              <i data-icon="minus"></i></button
            ><button id="fit" class="quiet" title="适应窗口">适应</button
            ><button id="plus" class="icon-btn" aria-label="放大">
              <i data-icon="plus"></i>
            </button>
          </div>
        </div>
      </section>
      <nav class="mobile-tabs" aria-label="编辑面板">
        <button data-panel="library">预设与图层</button
        ><button data-panel="inspector" aria-pressed="true">属性与照片</button>
      </nav>
      <aside class="inspector" id="inspector" aria-label="属性检查器">
        <div class="panel-tabs">
          <button data-tab="layer" class="active">图层属性</button
          ><button data-tab="frame">画框</button
          ><button data-tab="photo">照片信息</button>
        </div>
        <div id="properties" class="property-content"></div>
      </aside>
    </main>
    <input
      id="files"
      type="file"
      accept=".kaiphoto,.zip,image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif,image/bmp,image/gif,image/tiff,.nef,.psd,.psb,.tif,.tiff,.ora,.kra,.krz,.avif,.heic,.heif,.bmp,.gif"
      hidden
    />
    <input id="logo-file" type="file" accept="image/png" hidden />
    <dialog id="dialog">
      <div class="modal-inner">
        <div class="section-title">
          <h2 id="modal-title"></h2>
          <button id="dismiss" class="icon-btn" aria-label="关闭">
            <i data-icon="close"></i>
          </button>
        </div>
        <div id="modal-body"></div>
      </div>
    </dialog>
    <div id="status" role="status" aria-live="polite" hidden></div>
  </body>
</html>
