name: Android
on:
  push:
    paths: &android_paths
      - 'app/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *android_paths
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run Android 16 instrumentation tests
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testLibraryDebugUnitTest :app:testPickerDebugUnitTest :app:lintLibraryDebug :app:assembleLibraryDebug :app:assemblePickerDebug :app:bundlePickerRelease
      - uses: actions/upload-artifact@v4
        with:
          name: photomark-builds
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/bundle/pickerRelease/*.aab
      - if: inputs.device_tests
        name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - if: inputs.device_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedLibraryDebugAndroidTest
