name: Android
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testLibraryDebugUnitTest :app:lintLibraryDebug :app:assembleLibraryDebug :app:assemblePickerDebug :app:bundlePickerRelease
      - uses: actions/upload-artifact@v4
        with:
          name: photomark-builds
          path: |
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/bundle/pickerRelease/*.aab
